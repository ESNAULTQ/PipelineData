name: CI/CD Pipeline Data NYC Taxi

on:
    push:
        branches: [main, master, develop, feature/*]
    pull_request:
        branches: [main, develop]

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: test_data_nyc_taxi_db
                    POSTGRES_USER: postgres
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.11"

            - name: Cache pip dependencies
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('api/requirements.txt') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r api/requirements.txt

            - name: Create required directories
              run: |
                  cd api
                  mkdir -p static
                  mkdir -p templates

            - name: Run database migrations
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_data_nyc_taxi_db
              run: |
                  cd api
                  alembic upgrade head

            - name: Run tests with pytest
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_data_nyc_taxi_db
                  SECRET_KEY: test_secret_key_for_ci
                  SUPERUSER_USERNAME: test_admin
                  SUPERUSER_EMAIL: test@example.com
                  SUPERUSER_NOM_COMPLET: Test Admin
                  SUPERUSER_PASSWORD: test_password
                  SUPERUSER_ROLE: admin
              run: |
                  cd api
                  pytest pytests/ -v --cov=. --cov-report=term-missing --cov-report=html:htmlcov

            - name: Upload coverage reports
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-reports
                  path: api/htmlcov/
                  retention-days: 30

            - name: Log in to Docker Hub
              if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') }}
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push Docker image
              if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') }}
              uses: docker/build-push-action@v5
              with:
                  context: api
                  file: api/Dockerfile
                  push: true
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/data-nyc-taxi-api:latest
                      ${{ secrets.DOCKERHUB_USERNAME }}/data-nyc-taxi-api:${{ github.run_number }}
