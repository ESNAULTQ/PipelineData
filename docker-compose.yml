services:
    pipeline-postgres:
        image: postgres:15
        container_name: pipeline-postgres
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        ports:
            - ${POSTGRES_PORT}:5432
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    pipeline-data:
        build: .
        container_name: pipeline-data-app
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_HOST=${POSTGRES_HOST}
            - POSTGRES_PORT=${POSTGRES_PORT}
            - MONGO_USER=${MONGO_USER}
            - MONGO_PASSWORD=${MONGO_PASSWORD}
            - MONGO_DB=${MONGO_DB}
            - MONGO_HOST=${MONGO_HOST}
            - MONGO_PORT=${MONGO_PORT}
            - PYTHONUNBUFFERED=1
        ports:
            - "8000:8000"
        volumes:
            - ./src/data:/app/data
        depends_on:
            pipeline-postgres:
                condition: service_healthy
        command: uvicorn src.routes.app:app --host 0.0.0.0 --port 8000 --reload

    mongo:
        image: mongo:8.0
        container_name: mongodb
        restart: always
        ports:
            - "${MONGO_PORT}:27017" # Expose MongoDB on the default port
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER} # Set the admin username
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD} # Set the admin password
        volumes:
            - mongo-data:/data/db # Persist MongoDB data
            - mongo-config:/data/configdb # Persist MongoDB configuration

volumes:
    postgres_data:
    mongo-data:
        driver: local
    mongo-config:
